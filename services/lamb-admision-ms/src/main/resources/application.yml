spring:
  application:
    name: lamb-admision-ms
  profiles:
    active: dev
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:28888}"

# Servicios externos
lamb:
  reniec:
    base-url: https://api.apis.net.pe
    # Token de apis.net.pe — override con env var LAMB_RENIEC_TOKEN si se quiere rotar
    token: ${LAMB_RENIEC_TOKEN:}
  resend:
    base-url: https://api.resend.com
    # API key de Resend (si vacía → modo mock, solo loguea)
    key: ${LAMB_RESEND_KEY:}
    # Formato "Nombre <correo@dominio>" o solo correo. Por defecto usa el sandbox de Resend.
    from-email: ${LAMB_RESEND_FROM:Admisión UPeU <onboarding@resend.dev>}
    from-name: ${LAMB_RESEND_FROM_NAME:Admisión UPeU}
